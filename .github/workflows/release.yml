name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.4.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BRW_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # A release must run from the exact tag commit. Every other job needs this one,
  # so a mis-tagged run fails before any of the expensive work starts.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release tag and checkout
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z, got $tag" >&2
            exit 2
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Release workflow must run from the exact tag ref ($tag), got $GITHUB_REF" >&2
            exit 2
          fi
          git show-ref --verify --quiet "refs/tags/$tag"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "refs/tags/$tag")" = "$GITHUB_SHA"

  # Each shard keeps -p=1: the browser, snapshot and artifact tests each launch a
  # real headless Chrome, and many Chrome roots on one runner turn the Manager's
  # 20s operation timeout into a load race. The parallelism is the matrix — see
  # scripts/test-shard.sh.
  test-shard:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The split follows measured cost, not package count. Of 508s locally:
          # browser 312s, snapshot 81s, artifact 24s, extensionbridge 14s, and all
          # 41 other packages 20s together. The -race build below is the other
          # heavyweight: it recompiles the world with instrumentation, which is why
          # it lives in its own shard rather than inside the static checks.
          - name: browser-1
            run: ./scripts/test-shard.sh package 1 4 ./internal/browser
          - name: browser-2
            run: ./scripts/test-shard.sh package 2 4 ./internal/browser
          - name: browser-3
            run: ./scripts/test-shard.sh package 3 4 ./internal/browser
          - name: browser-4
            run: ./scripts/test-shard.sh package 4 4 ./internal/browser
          - name: snapshot-1
            run: ./scripts/test-shard.sh package 1 2 ./internal/snapshot
          - name: snapshot-2
            run: ./scripts/test-shard.sh package 2 2 ./internal/snapshot
          - name: bridge-1
            run: ./scripts/test-shard.sh package 1 2 ./internal/extensionbridge
          - name: bridge-2
            run: ./scripts/test-shard.sh package 2 2 ./internal/extensionbridge
          - name: rest-1
            run: ./scripts/test-shard.sh rest 1 2
          - name: rest-2
            run: ./scripts/test-shard.sh rest 2 2
          - name: race-bridge
            run: go test -race ./internal/extensionbridge
          - name: race-core
            run: go test -race ./internal/artifact ./internal/recipe ./internal/mcp ./internal/http ./internal/httpclient ./internal/navpolicy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify dependency checksums
        run: go mod verify
      - name: Test shard ${{ matrix.name }}
        run: ${{ matrix.run }}

  # One job named `test` so the packaging jobs keep a single name to gate on, and
  # it cannot go green unless every shard did.
  test:
    needs: test-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test shard passed
        run: echo "all Go test shards passed"

  static:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Enforce open-source privacy boundary
        shell: bash
        run: |
          base="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          python3 scripts/check-oss-hygiene.py "$base"
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact --no-banner
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  functional:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.50.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify dependency checksums
        run: go mod verify
      - name: Test the real extension worker
        run: task test-extension
      - name: Run deterministic real-browser functional suite
        run: task test-functional

  linux-packages:
    needs: [test, static, functional]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve version
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z, got $tag" >&2
            exit 2
          fi
          echo "BRW_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BRW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build Linux packages
        run: scripts/package-linux.sh "$BRW_VERSION" "${{ matrix.arch }}" dist/release
      - name: Build the Linux tarball
        run: scripts/package-tarball.sh "$BRW_VERSION" linux "${{ matrix.arch }}" dist/release
      - name: Record signing status
        shell: bash
        run: |
          mkdir -p dist/reports
          {
            echo "### Linux (${{ matrix.arch }} .deb / .rpm)"
            echo ""
            echo "- Packages: **unsigned**. There is no distribution GPG key, so \`dpkg-sig\`/\`rpm --checksig\` have nothing to check. Use the checksums and the build provenance attestation instead."
            echo ""
          } > "dist/reports/30-linux-${{ matrix.arch }}.signing.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brw-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brw-linux-${{ matrix.arch }}-signing
          path: dist/reports/*.signing.md
          if-no-files-found: error

  macos-package:
    needs: [test, static, functional]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve version
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z, got $tag" >&2
            exit 2
          fi
          echo "BRW_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BRW_VERSION=$version" >> "$GITHUB_ENV"
      # The certificates below are a purchase the project has not made yet. Until
      # they exist this step must leave the build on the ad-hoc path rather than
      # fail, or tagging a release stops working for a reason unrelated to the tag.
      - name: Import Developer ID signing material
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          # BSD base64 spells the decode flag -D on older macOS and -d on current
          # releases; probe once instead of pinning to whichever the runner has.
          b64decode() {
            if printf '' | base64 -d >/dev/null 2>&1; then
              base64 -d
            else
              base64 -D
            fi
          }

          if [ -z "${MACOS_CERTIFICATE_P12:-}" ]; then
            echo "::warning title=macOS artifacts are ad-hoc signed::MACOS_CERTIFICATE_P12 is not set. The .pkg is unsigned and its binaries carry an ad-hoc signature, so Gatekeeper reports an unidentified developer. See docs/release-signing.md."
            echo "BRW_MACOS_SIGNING=ad-hoc" >> "$GITHUB_ENV"
            echo "BRW_MACOS_NOTARIZE=no" >> "$GITHUB_ENV"
            exit 0
          fi

          keychain="$RUNNER_TEMP/brw-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/brw-signing.p12"

          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | b64decode > "$p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "${MACOS_CERTIFICATE_PASSWORD:-}" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/productsign
          # Without an explicit partition list every codesign call blocks on a GUI
          # prompt that no runner can answer.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"

          sign_identity="${MACOS_SIGN_IDENTITY:-}"
          if [ -z "$sign_identity" ]; then
            sign_identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          fi
          installer_identity="${MACOS_INSTALLER_IDENTITY:-}"
          if [ -z "$installer_identity" ]; then
            installer_identity="$(security find-identity -v "$keychain" | awk -F'"' '/Developer ID Installer/ {print $2; exit}')"
          fi
          if [ -z "$sign_identity" ] || [ -z "$installer_identity" ]; then
            echo "A signing certificate was supplied but the keychain has no Developer ID Application and Developer ID Installer pair" >&2
            exit 1
          fi

          {
            echo "MACOS_KEYCHAIN=$keychain"
            echo "MACOS_SIGN_IDENTITY=$sign_identity"
            echo "MACOS_INSTALLER_IDENTITY=$installer_identity"
            echo "BRW_MACOS_SIGNING=developer-id"
          } >> "$GITHUB_ENV"

          if [ -n "${APPLE_API_KEY_P8:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER_ID:-}" ]; then
            key_path="$RUNNER_TEMP/brw-notary-key.p8"
            printf '%s' "$APPLE_API_KEY_P8" | b64decode > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            echo "BRW_MACOS_NOTARIZE=yes" >> "$GITHUB_ENV"
          else
            echo "::warning title=macOS artifacts are not notarized::A Developer ID certificate is configured but the App Store Connect API key trio is not, so the .pkg carries no notarization ticket and Gatekeeper still blocks it on first use."
            echo "BRW_MACOS_NOTARIZE=no" >> "$GITHUB_ENV"
          fi
      - name: Build macOS package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BRW_SIGNING_REPORT: ${{ github.workspace }}/dist/reports/10-macos-universal.signing.md
        run: scripts/package-macos.sh "$BRW_VERSION" dist/release
      # Both darwin arches are built on this runner rather than alongside the
      # Linux tarballs because codesign exists only on macOS, and a darwin binary
      # without even an ad-hoc signature is SIGKILLed on Apple Silicon.
      - name: Build the macOS tarballs
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-tarball.sh "$BRW_VERSION" darwin amd64 dist/release
          scripts/package-tarball.sh "$BRW_VERSION" darwin arm64 dist/release
      - name: Verify macOS signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          pkg="dist/release/brw_${BRW_VERSION}_macos_universal.pkg"
          expanded="$RUNNER_TEMP/pkg-expanded"
          rm -rf "$expanded"
          pkgutil --expand-full "$pkg" "$expanded"

          log="$RUNNER_TEMP/macos-verification.txt"
          : > "$log"

          # Verify what shipped, not what was staged: the payload is re-read out of
          # the .pkg so a signature lost during packaging cannot pass unnoticed.
          for binary in "$expanded"/Payload/usr/local/bin/*; do
            codesign --verify --deep --strict --verbose=2 "$binary" 2>&1 | tee -a "$log"
          done

          if [ "${BRW_MACOS_SIGNING:-ad-hoc}" = "developer-id" ]; then
            pkgutil --check-signature "$pkg" 2>&1 | tee -a "$log"
            if [ -n "${APPLE_TEAM_ID:-}" ]; then
              display="$RUNNER_TEMP/codesign-display.txt"
              codesign --display --verbose=4 "$expanded/Payload/usr/local/bin/brwd" >"$display" 2>&1
              cat "$display" >> "$log"
              # Catches a certificate from the wrong Apple account, which signs
              # and notarizes cleanly but is not the team users were told to trust.
              grep -qx "TeamIdentifier=$APPLE_TEAM_ID" "$display"
            fi
          else
            echo "ad-hoc signature: no Developer ID, no Team ID, no notarization ticket" | tee -a "$log"
          fi

          if [ "${BRW_MACOS_NOTARIZE:-no}" = "yes" ]; then
            spctl -a -vvv -t install "$pkg" 2>&1 | tee -a "$log"
            xcrun stapler validate "$pkg" 2>&1 | tee -a "$log"
          fi

          {
            echo "## macOS signing verification"
            echo ""
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/brw-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/brw-signing.p12" "$RUNNER_TEMP/brw-notary-key.p8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brw-macos-universal
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brw-macos-universal-signing
          path: dist/reports/*.signing.md
          if-no-files-found: error

  # The Windows MSI job was removed on 2026-09-16: the MSIs shipped unsigned
  # (no Authenticode certificate), so they only produced SmartScreen warnings and
  # a signing-verification report nobody could act on. Restore it by reverting
  # this hunk and re-adding windows-packages to publish-release's needs list.
  publish-release:
    needs:
      - linux-packages
      - macos-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Resolve version
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z, got $tag" >&2
            exit 2
          fi
          echo "BRW_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BRW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Separate signing reports from release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-reports
          if ! compgen -G "artifacts/*.signing.md" >/dev/null; then
            echo "No packaging job produced a signing report; the release notes would not say how the installers were signed" >&2
            exit 2
          fi
          mv artifacts/*.signing.md signing-reports/
      # The attestation subject glob and the release upload glob are both
      # artifacts/*. They can only name different sets if a nested directory
      # appears, which would publish a file nothing attested, so fail here.
      - name: Check every publishable artifact is attestable
        shell: bash
        run: |
          set -euo pipefail
          if find artifacts -mindepth 1 -type d | grep -q .; then
            echo "artifacts/ must stay flat: a directory means the attestation subject set no longer matches what is published" >&2
            find artifacts -mindepth 1 -type d >&2
            exit 2
          fi
          echo "Built packages to publish: $(find artifacts -type f | wc -l | tr -d ' ')"
      - name: Generate CycloneDX SBOM
        run: >-
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          mod -json -output "artifacts/brw_${BRW_VERSION}_sbom.cdx.json"
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          shasum -a 256 ./* > SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      # The .tar.gz assets carry no signature of their own and are not covered by
      # any packaging job's report, so without this the notes would describe how
      # every installer is signed except the one install.sh downloads.
      - name: Record tarball signing status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Relocatable tarballs (.tar.gz)"
            echo ""
            echo "- macOS binaries: **ad-hoc signed**, which is what lets Apple Silicon run them at all. No Developer ID is involved on this path; \`scripts/install.sh\` re-applies the same ad-hoc signature after unpacking. The \`.pkg\` above is the signed macOS installer."
            echo "- Linux binaries: **unsigned**, as on the \`.deb\` / \`.rpm\` path."
            echo "- Every archive ships a matching \`.sha256\`. \`install.sh\` checks it before unpacking and falls back to \`SHA256SUMS.txt\`, and the provenance attestation covers the archive itself."
            echo ""
          } > signing-reports/40-tarballs.signing.md
      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Verifying this download"
            echo ""
            echo "Every file attached below is listed in \`SHA256SUMS.txt\` and carries a GitHub build provenance attestation, which ties the file to this repository, this tag and the workflow run that produced it. Run this against anything you download from here:"
            echo ""
            echo '```'
            echo "gh attestation verify brw_${BRW_VERSION}_macos_universal.pkg --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo ""
            echo "Substitute whichever file you downloaded. A checksum alone only proves the file matches this page; the attestation proves the file was built by this repository's release workflow from tag \`${BRW_RELEASE_TAG}\`."
            echo ""
            echo "A CycloneDX SBOM of the Go dependency graph is attached as \`brw_${BRW_VERSION}_sbom.cdx.json\`."
            echo ""
            echo "## Installer signing"
            echo ""
            cat signing-reports/*.signing.md
          } > "$notes"
          echo "BRW_RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
          {
            echo "## Release notes"
            echo ""
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          title="brw $tag"
          notes="$BRW_RELEASE_NOTES"

          # The generated changelog and a hand-written draft body are both worth
          # keeping, so the verification block goes in front of whatever is there
          # rather than replacing it, and only if it is not already present.
          prepend_verification_notes() {
            local body merged
            body="$(gh release view "$tag" --json body --jq .body)"
            case "$body" in
              *"## Verifying this download"*) return 0 ;;
            esac
            merged="$RUNNER_TEMP/merged-notes.md"
            { cat "$notes"; echo ""; printf '%s\n' "$body"; } > "$merged"
            gh release edit "$tag" --notes-file "$merged"
          }

          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$state" = "false" ]; then
            echo "Release $tag is already published; refusing to replace immutable assets" >&2
            exit 2
          elif [ "$state" = "true" ]; then
            gh release upload "$tag" artifacts/* --clobber
          else
            previous_tag="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // empty')"
            notes_args=(--generate-notes)
            if [ -n "$previous_tag" ]; then
              notes_args+=(--notes-start-tag "$previous_tag")
            fi
            gh release create "$tag" artifacts/* --title "$title" --verify-tag --draft "${notes_args[@]}"
          fi
          prepend_verification_notes
          gh release edit "$tag" --draft=false --latest

  homebrew-tap:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Resolve version
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z, got $tag" >&2
            exit 2
          fi
          echo "BRW_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BRW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Render the Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          # render-formula.sh falls back to downloading the published
          # SHA256SUMS.txt when a local sum is missing, which would let a release
          # that never built one of the four archives still produce a formula
          # pointing at it. The archives are the formula's entire subject matter.
          for target in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            sum="artifacts/brw_${BRW_VERSION}_${target}.tar.gz.sha256"
            if [ ! -f "$sum" ]; then
              echo "$sum is missing: this release published no $target tarball, so the tap cannot be bumped" >&2
              exit 2
            fi
          done
          packaging/homebrew/render-formula.sh "$BRW_VERSION" artifacts > "$RUNNER_TEMP/brw.rb"
          {
            echo "## Homebrew formula for $BRW_RELEASE_TAG"
            echo ""
            echo '```ruby'
            cat "$RUNNER_TEMP/brw.rb"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # github.token is scoped to this repository and cannot write to the tap, so
      # a separate token is the only way to push the bump. Its absence leaves the
      # tap on the previous release and must not fail a release that is already
      # published; a token that is present but cannot write is a broken secret.
      - name: Commit the formula to Don-Works/homebrew-tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tap="Don-Works/homebrew-tap"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Homebrew tap not bumped::HOMEBREW_TAP_TOKEN is not set, so $tap still carries the previous release and 'brew install don-works/tap/brw' installs the old version. The rendered formula is in this job's summary; commit it to $tap as Formula/brw.rb by hand, or set the secret. See docs/release-signing.md."
            exit 0
          fi

          if ! gh api "repos/$tap" --jq .full_name >/dev/null; then
            echo "HOMEBREW_TAP_TOKEN is set but cannot read $tap. It has expired, been revoked, or was minted without Contents: Read and write on that repository. See docs/release-signing.md." >&2
            exit 1
          fi

          existing_sha="$(gh api "repos/$tap/contents/Formula/brw.rb" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$tap/contents/Formula/brw.rb")
          args+=(-f "message=brw $BRW_VERSION")
          args+=(-f "content=$(base64 -w0 < "$RUNNER_TEMP/brw.rb")")
          if [ -n "$existing_sha" ]; then
            args+=(-f "sha=$existing_sha")
          fi
          gh api "${args[@]}" --jq .commit.html_url
