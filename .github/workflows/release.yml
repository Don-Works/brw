name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.4.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BRW_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release tag and checkout
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z, got $tag" >&2
            exit 2
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Release workflow must run from the exact tag ref ($tag), got $GITHUB_REF" >&2
            exit 2
          fi
          git show-ref --verify --quiet "refs/tags/$tag"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "refs/tags/$tag")" = "$GITHUB_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify dependency checksums
        run: go mod verify
      - name: Test
        run: make test
      - name: Run deterministic real-browser functional suite
        run: make test-functional
      - name: Enforce open-source privacy boundary
        shell: bash
        run: |
          base="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          python3 scripts/check-oss-hygiene.py "$base"
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact --no-banner
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  linux-packages:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve version
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z, got $tag" >&2
            exit 2
          fi
          echo "BRW_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BRW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build Linux packages
        run: scripts/package-linux.sh "$BRW_VERSION" "${{ matrix.arch }}" dist/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brw-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  macos-package:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve version
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z, got $tag" >&2
            exit 2
          fi
          echo "BRW_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BRW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build macOS package
        run: scripts/package-macos.sh "$BRW_VERSION" dist/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brw-macos-universal
          path: dist/release/*
          if-no-files-found: error

  windows-packages:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Resolve version
        shell: pwsh
        run: |
          $tag = $env:BRW_RELEASE_TAG
          $version = $tag -replace "^v", ""
          if ($version -notmatch "^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$") {
            throw "Tag must be vX.Y.Z, got $tag"
          }
          "BRW_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRW_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows package
        shell: pwsh
        run: scripts/package-windows.ps1 -Version "$env:BRW_VERSION" -Arch "${{ matrix.arch }}" -OutDir dist/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brw-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    needs:
      - linux-packages
      - macos-package
      - windows-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Resolve version
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z, got $tag" >&2
            exit 2
          fi
          echo "BRW_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BRW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate CycloneDX SBOM
        run: >-
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          mod -json -output "artifacts/brw_${BRW_VERSION}_sbom.cdx.json"
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          shasum -a 256 ./* > SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$BRW_RELEASE_TAG"
          title="brw $tag"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$state" = "false" ]; then
            echo "Release $tag is already published; refusing to replace immutable assets" >&2
            exit 2
          elif [ "$state" = "true" ]; then
            gh release upload "$tag" artifacts/* --clobber
          else
            previous_tag="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // empty')"
            notes_args=(--generate-notes)
            if [ -n "$previous_tag" ]; then
              notes_args+=(--notes-start-tag "$previous_tag")
            fi
            gh release create "$tag" artifacts/* --title "$title" --verify-tag --draft "${notes_args[@]}"
          fi
          gh release edit "$tag" --draft=false --latest
