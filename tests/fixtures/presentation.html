<!doctype html>
<meta charset="utf-8">
<title>Presentation capture fixture</title>
<style>
html,body{margin:0;padding:0;min-height:1600px}
#media{position:absolute;left:20px;top:40px;width:320px;height:100px;border:0;padding:0;background:none}
#gl,#video{position:absolute;top:0;width:160px;height:100px}
#gl{left:0}#video{left:160px}
#overlay{position:absolute;left:20px;top:40px;width:320px;height:100px;background:blue;z-index:2}
#source{display:none}
#bottom{position:absolute;top:1500px;left:20px;width:100px;height:50px;background:rgb(255,0,255)}
</style>
<button id="media" aria-label="Rendered media"><canvas id="gl" width="160" height="100"></canvas><video id="video" autoplay muted playsinline></video></button>
<div id="overlay" style="visibility:visible !important"></div><canvas id="source" width="160" height="100"></canvas><div id="bottom"></div>
<script>
const gl=document.querySelector('#gl').getContext('webgl');
const source=document.querySelector('#source');
const ctx=source.getContext('2d');
const video=document.querySelector('#video');
video.srcObject=source.captureStream(30);
function paint(){
 gl.clearColor(1,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
 ctx.fillStyle='rgb(0,255,0)';ctx.fillRect(0,0,160,100);
 requestAnimationFrame(paint);
}
paint();
video.play().then(()=>{window.fixtureReady=true;});
</script>
